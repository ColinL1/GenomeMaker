# ============================================================
# MultiQC configuration -- the integrated run report.
#
# Sections follow the pipeline's stage order instead of being grouped by tool.
# ============================================================

title: "Coral Genome Assembly & Annotation"
subtitle: "Integrated per-stage run report"
intro_text: >
  Every stage of the pipeline reports here, in execution order: read QC, k-mer
  genome sizing, assembler comparison and selection (or the supplied assembly),
  mitochondrial contigs, polishing (with its QC gate), the BlobToolKit host/symbiont
  split, duplicate purging (with its QC gate), contamination screens, scaffolding,
  repeats, structural and functional annotation and, with the release curation, the
  release QC. The run overview at the top lists the automatic decisions; the methods
  are at the bottom. Sections absent from a given run belong to stages that were off.

# ---- Stage order: report_section_order below positions every section (higher = earlier) ----
module_order:
  - fastqc:
      name: "00 Reads: FastQC (diagnostic only; NanoStat is the long-read QC)"
      info: >
        FastQC is a short-read tool; on ONT long reads several of its checks (per-base
        quality, duplication, adapter content) are not meaningful. Kept only as a
        diagnostic of what porechop removed. The primary read QC is NanoStat below.
  - nanostat:
      name: "00 Reads: NanoStat"
      info: "ONT read length and quality distributions."
  - quast:
      name: "02 Assembly: QUAST"
      info: "Per-assembler contiguity (multi-assembler mode only)."
  - busco:
      name: "02-04 Assembly completeness: BUSCO (all stages)"
      info: >
        BUSCO on the assembly at every checkpoint: per assembler (or the supplied
        assembly), before/after polishing (the polish gate), after the taxonomic split
        (filtered) and after purge_dups (purged; the purge gate), and the final assembly.
  - samtools:
      name: "03/05 Coverage: samtools"
      info: "ONT alignment against the contigs of the BlobToolKit split (stage 03) and the mitogenome (stage 05)."
  - star:
      name: "07 Structural: RNA-seq alignment (STAR)"
      info: "RNA-seq alignment rate -- the transcript evidence BRAKER's gene models rest on."

# Custom-content sections nest under one parent per stage (parent_id in their headers).
# Top-level order sorts DESCENDING (higher = earlier); children of a parent sort
# ASCENDING. The two blocks below use opposite numbering on purpose.
report_section_order:
  pipeline_summary:                   {order: 2000}
  genome_summary:                     {order: 1990}
  fastqc:                             {order: 1000}
  nanostat:                           {order: 990}
  quast:                              {order: 900}
  stage02_gfastats:                   {order: 890}
  stage02b_ranking:                   {order: 885}
  busco:                              {order: 880}
  stage03_filtering:                  {order: 800}
  # children of stage03_filtering: ascending = reading order
  stage03_blobtools_filter:           {order: 1}
  stage03_blobtools_plots:            {order: 2}
  stage03_blobtools_cumulative:       {order: 3}
  samtools:                           {order: 780}
  purge_qc_gate:                      {order: 770}
  gapfill:                            {order: 760}
  polish_qc_gate:                     {order: 700}
  stage04_polishing:                  {order: 700}
  stage04_merqury:                    {order: 690}
  stage05_mitogenome:                 {order: 650}
  # children of stage05_mitogenome: ascending = reading order
  stage05_mito_removed:               {order: 0}
  stage05_mito_summary:               {order: 1}
  stage05_mito_gene_check:            {order: 2}
  stage05_mito_liftoff:               {order: 3}
  stage05_mito_mitos2:                {order: 4}
  stage06_repeats:                    {order: 600}
  # children of stage06_repeats: ascending = reading order
  stage06_repeatmasker:               {order: 1}
  stage06_barrnap:                    {order: 2}
  star:                               {order: 500}
  stage07_structural:                 {order: 499}
  # children of stage07_structural: ascending = reading order
  stage07_braker_geneset:             {order: 1}
  stage07_star_qc_flag:               {order: 2}
  stage07_braker_busco:               {order: 3}
  stage07_braker_completeness:        {order: 4}
  stage07_braker_transcript_lengths_cds:  {order: 5}
  stage07_braker_transcript_lengths_span: {order: 6}
  stage07_trnascan:                   {order: 7}
  stage07_infernal_types:             {order: 8}
  stage07_infernal_families:          {order: 9}
  stage07_stringtie:                  {order: 10}
  stage07_compleasm:                  {order: 11}
  stage07_omark:                      {order: 12}
  stage07_gff3_validation:            {order: 13}
  stage08_functional:                 {order: 300}
  # children of stage08_functional: ascending = reading order
  stage08_phobius:                    {order: 1}
  stage10_release:                    {order: 250}
  # children of stage10_release: ascending = reading order
  stage10_release_qc:                 {order: 1}
  stage10_table2asn:                  {order: 2}
  stage10_discrepancies:              {order: 3}
  software_versions:                  {order: -1000}
  methods:                            {order: -2000}

# ---- File search patterns ----
# BUSCO summaries are renamed <name>.<lineage>.short_summary.txt
sp:
  busco:
    fn: "*short_summary*.txt"
    contents: "BUSCO version is:"

# ---- Sample name cleanup so the same assembly is not listed under variants ----
extra_fn_clean_exts:
  - ".gfastats"
  - ".short_summary"
  - "_quast_report"
  - ".sorted"
  - "_Log.final.out"
  - ".fastq.gz"
  - "_fastqc"

# ---- Readable sample names -------------------------------------------------------
# One label per entity wherever it appears (module tables and General Statistics).
# BUSCO rows are stage-labelled; 'final' is the delivered assembly.
sample_names_replace_regex: true
sample_names_replace:
  "^Por_GA_15_allrun$": "ONT reads raw"
  "^ONT_reads_pc$": "ONT reads trimmed (porechop)"
  "^ONT_raw\\.NanoStats$": "ONT reads raw"
  "^ONT_trimmed\\.NanoStats$": "ONT reads trimmed (porechop)"
  "^ONT_trimmed\\.NanoStats_post_filtering$": "ONT reads trimmed + NanoPlot filter"
  "^coverage$": "ONT reads vs contigs (BlobToolKit input)"
  "^mito_(flagstat|coverage)$": "ONT reads vs mitogenome"
  "^input_assembly\\.anthozoa_odb12$": "02 input assembly"
  "^prepolish\\.anthozoa_odb12$": "04 pre-polish (polish gate input)"
  "^postpolish\\.anthozoa_odb12$": "04 post-polish (Medaka; polish gate output)"
  "^filtered\\.anthozoa_odb12$": "03 host bin (BlobToolKit split)"
  "^purged\\.anthozoa_odb12$": "03b purged (purge_dups)"
  "^final\\.anthozoa_odb12$": "FINAL ASSEMBLY"
  # RNA-seq libraries: "20230326_Por_GT_28_15_RNA-Seq_QCVTS..." -> "RNA-seq GT_28_15"
  "^\\d+_Por_([A-Z]+_\\d+_\\d+)_RNA-Seq_.*$": "RNA-seq \\1"

# Both NanoPlot runs write NanoStats.txt; the copies ONT_raw.* / ONT_trimmed.* are used instead.
fn_ignore_paths:
  - "*qc_nanoplot_raw*"
  - "*qc_nanoplot_trimmed*"

# ---- General Statistics: only metrics that compare across samples --------------
# Module-specific columns stay in each module's own table (and in multiqc_data).
table_columns_visible:
  busco:
    lineage_dataset: False
  "00 Reads: FastQC (diagnostic only; NanoStat is the long-read QC)": False
  "00 Reads: NanoStat":
    Read_length_N50_fastq: True
    Total_bases_fastq: True
    Median_read_length_fastq: False
    Mean_read_length_fastq: False
    Median_read_quality_fastq: False
  "02-04 Assembly completeness: BUSCO (all stages)":
    complete: True
    missing: True
    complete_single_copy: False
    complete_duplicated: False
    fragmented: False
  "03/05 Coverage: samtools: flagstat":
    mapped_passed_pct: True
    flagstat_total: False
    mapped_passed: False
  "03/05 Coverage: samtools: coverage":
    meandepth: True
    numreads: False
    covbases: False
    coverage: False
    meanbaseq: False
    meanmapq: False
  "07 Structural: RNA-seq alignment (STAR)":
    uniquely_mapped_percent: True
    mapped: False
    uniquely_mapped: False
    multimapped: False

# ---- Conditional formatting for metrics with known thresholds -------------------
table_cond_formatting_rules:
  uniquely_mapped_percent:        # STAR: evidence for BRAKER
    pass: [{gt: 70}]
    warn: [{lt: 70}]
    fail: [{lt: 30}]
  mapped_passed_pct:              # samtools flagstat
    pass: [{gt: 90}]
    warn: [{lt: 90}]
    fail: [{lt: 70}]
  missing:                        # BUSCO missing %
    pass: [{lt: 5}]
    warn: [{gt: 5}]
    fail: [{gt: 10}]
  verdict:                        # polish and purge QC gates
    pass: [{s_eq: "PASS"}]
    warn: [{s_eq: "WARN"}]
    fail: [{s_eq: "FAIL"}, {s_eq: "UNPARSED"}]
  "Gate status":                  # run overview
    pass: [{s_eq: "PASS"}]
    warn: [{s_eq: "WARN"}]
    fail: [{s_eq: "FAIL"}, {s_eq: "UNPARSED"}]
  "Status":                       # stage07_star_qc_flag
    pass: [{s_eq: "PASS"}]
    warn: [{s_eq: "WARN"}]
    fail: [{s_eq: "FAIL"}]

# ---- One-line context under each section: what decision the stage feeds --------
# Native modules only: stageNN_* sections carry their own description.
section_comments:
  fastqc: "Diagnostic only for long reads; does not gate anything."
  nanostat: "Read length/quality of the ONT data that every assembler and the polishing step consume."
  quast: "Contiguity per assembler; feeds the assembler ranking (multi-assembler mode)."
  busco: "Completeness at every stage; the pre/post-polish pair feeds the polish QC gate, the filtered/purged pair the purge QC gate."
  samtools: "ONT read support for the contigs of the BlobToolKit split (stage 03) and the mitogenome (stage 05)."
  polish_qc_gate: "Decides whether the polished or the unpolished contigs go on."
  purge_qc_gate: "Stops the run when purge_dups removed BUSCO genes beyond the tolerance."
  star: "RNA-seq evidence for BRAKER; low rates mean gene models lean on protein evidence."

# ---- Exports: full underlying data, not just the rendered view -------------------
max_table_rows: 2000
plots_force_interactive: true
export_plots: true
data_format: "tsv"
data_dump_file: true

# The pipeline's own collated versions table (COLLATE_VERSIONS) is the software
# provenance section; MultiQC's built-in one would duplicate it.
skip_versions_section: true
